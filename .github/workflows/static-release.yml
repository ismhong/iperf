name: Static Release Build

on:
  push:
    tags:
      - 'v*'          # 推 tag 時觸發，例如 v3.18.0
  workflow_dispatch:  # 也可手動觸發

permissions:
  contents: write   # 允許上傳 Release artifacts

jobs:
  build-static:
    name: Static (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64：用一般 ubuntu runner，在 Alpine x86_64 容器內編譯
          - arch: x86_64
            runner: ubuntu-latest
            docker_platform: linux/amd64
            docker_image: alpine:3.20
            march: ""
            mabi: ""

          # arm64：用 ubuntu arm runner，在 Alpine arm64 容器內編譯
          - arch: arm64
            runner: ubuntu-22.04-arm   # GitHub 提供的原生 arm64 runner
            docker_platform: linux/arm64
            docker_image: alpine:3.20
            march: ""
            mabi: ""

          # riscv64：GitHub 無原生 runner，走 QEMU/binfmt 模擬
          # 目標 CPU 只支援 rv64imac（無浮點單元），故指定 march/mabi
          - arch: riscv64
            runner: ubuntu-latest
            docker_platform: linux/riscv64
            docker_image: alpine:3.20
            march: rv64imac
            mabi: lp64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # riscv64 需要 QEMU user-mode 模擬才能執行 riscv64 Docker
      - name: Setup QEMU binfmt (riscv64 only)
        if: matrix.arch == 'riscv64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      # 在 Alpine 容器內完成靜態編譯
      # Alpine 預設使用 musl libc，天生支援靜態連結
      - name: Build static binary inside Alpine container
        run: |
          docker run --rm \
            --platform ${{ matrix.docker_platform }} \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ${{ matrix.docker_image }} \
            sh -c '
              set -ex

              # 安裝編譯工具（musl libc + openssl 靜態庫）
              apk add --no-cache \
                build-base \
                autoconf \
                automake \
                linux-headers \
                openssl-dev \
                openssl-libs-static

              # 使用專案內建的 --enable-static-bin 旗標
              # (定義於 config/iperf_config_static_bin.m4，會自動加上 --static)
              # riscv64 限定 march/mabi（預設 rv64gc→imafdc，目標僅支援 imac）
              MARGS="${{ matrix.march }}"
              if [ -n "$MARGS" ]; then
                export CFLAGS="-march=${{ matrix.march }} -mabi=${{ matrix.mabi }}"
              fi
              ./configure --enable-static-bin

              make -j$(nproc)

              # 確認真的是靜態連結
              file src/iperf3
              ldd src/iperf3 2>&1 || true

              # strip 縮小體積
              strip src/iperf3

              # 複製到 dist/
              mkdir -p dist
              cp src/iperf3 dist/iperf3-${{ matrix.arch }}-linux-musl
            '

      - name: Verify static linking
        run: |
          file dist/iperf3-${{ matrix.arch }}-linux-musl
          file dist/iperf3-${{ matrix.arch }}-linux-musl | grep -i "statically linked"

      - name: Show binary size
        run: ls -lh dist/iperf3-${{ matrix.arch }}-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iperf3-${{ matrix.arch }}-linux-musl
          path: dist/iperf3-${{ matrix.arch }}-linux-musl
          if-no-files-found: error

  # 彙整兩個 arch 的產物，一起發佈到 GitHub Release
  release:
    name: Publish GitHub Release
    needs: build-static
    runs-on: ubuntu-latest
    # 只有推 tag 時才發布 Release；手動觸發只產生 artifact
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List files to be released
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
