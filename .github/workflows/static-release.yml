name: Static Release Build

on:
  push:
    tags:
      - 'v*'          # 推 tag 時觸發，例如 v3.18.0
  workflow_dispatch:  # 也可手動觸發

permissions:
  contents: write   # 允許上傳 Release artifacts

jobs:
  # ──────────────────────────────────────────────
  # Linux 靜態編譯（Alpine musl, x86_64 / arm64 / riscv64）
  # ──────────────────────────────────────────────
  build-static:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64：用一般 ubuntu runner，在 Alpine x86_64 容器內編譯
          - arch: x86_64
            runner: ubuntu-latest
            docker_platform: linux/amd64
            docker_image: alpine:3.20

          # arm64：用 ubuntu arm runner，在 Alpine arm64 容器內編譯
          - arch: arm64
            runner: ubuntu-22.04-arm   # GitHub 提供的原生 arm64 runner
            docker_platform: linux/arm64
            docker_image: alpine:3.20

          # riscv64：GitHub 無原生 runner，走 QEMU/binfmt 模擬
          - arch: riscv64
            runner: ubuntu-latest
            docker_platform: linux/riscv64
            docker_image: alpine:3.20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # riscv64 需要 QEMU user-mode 模擬才能執行 riscv64 Docker
      - name: Setup QEMU binfmt (riscv64 only)
        if: matrix.arch == 'riscv64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      # 在 Alpine 容器內完成靜態編譯
      # Alpine 預設使用 musl libc，天生支援靜態連結
      - name: Build static binary inside Alpine container
        run: |
          docker run --rm \
            --platform ${{ matrix.docker_platform }} \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            ${{ matrix.docker_image }} \
            sh -c '
              set -ex

              # 安裝編譯工具（musl libc + openssl 靜態庫）
              apk add --no-cache \
                build-base \
                autoconf \
                automake \
                linux-headers \
                openssl-dev \
                openssl-libs-static

              # 使用專案內建的 --enable-static-bin 旗標
              # (定義於 config/iperf_config_static_bin.m4，會自動加上 --static)
              ./configure --enable-static-bin

              make -j$(nproc)

              # 確認真的是靜態連結
              file src/iperf3
              ldd src/iperf3 2>&1 || true

              # strip 縮小體積
              strip src/iperf3

              # 複製到 dist/
              mkdir -p dist
              cp src/iperf3 dist/iperf3-${{ matrix.arch }}-linux-musl
            '

      - name: Verify static linking
        run: |
          file dist/iperf3-${{ matrix.arch }}-linux-musl
          file dist/iperf3-${{ matrix.arch }}-linux-musl | grep -i "statically linked"

      - name: Show binary size
        run: ls -lh dist/iperf3-${{ matrix.arch }}-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iperf3-${{ matrix.arch }}-linux-musl
          path: dist/iperf3-${{ matrix.arch }}-linux-musl
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Windows 交叉編譯（MinGW, x86_64 / aarch64）
  # 全部在 ubuntu runner 上完成，不需 Windows runner
  # ──────────────────────────────────────────────
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64：用 Ubuntu 套件庫的 mingw-w64 (GCC)
          - arch: x86_64
            host: x86_64-w64-mingw32
            strip: x86_64-w64-mingw32-strip

          # aarch64 (ARM64)：用 llvm-mingw (Clang)，因 Debian/Ubuntu 官方
          # mingw-w64 不支援 aarch64 目標
          - arch: aarch64
            host: aarch64-w64-mingw32
            strip: aarch64-w64-mingw32-strip
            llvm_mingw_url: https://github.com/mstorsjo/llvm-mingw/releases/download/20260812/llvm-mingw-20260812-ucrt-ubuntu-22.04-x86_64.tar.xz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # x86_64：用 apt 安裝穩定版 mingw-w64
      - name: Install MinGW toolchain (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64

      # aarch64：下載 llvm-mingw（Clang 基礎，支援 arm64 Windows 目標）
      - name: Download llvm-mingw (aarch64)
        if: matrix.arch == 'aarch64'
        run: |
          wget -q "${{ matrix.llvm_mingw_url }}"
          tar xf llvm-mingw-*.tar.xz
          echo "$PWD/llvm-mingw/bin" >> $GITHUB_PATH

      # 用 autotools cross-compilation 配置
      - name: Configure
        run: |
          ./bootstrap.sh
          # MinGW 的 socket API 在 ws2_32，不是 POSIX 的 libsocket
          # 透過 LIBS 讓 configure 的 AC_SEARCH_LIBS(socket) 能找到它
          LIBS="-lws2_32" ./configure \
            --host=${{ matrix.host }} \
            --enable-static-bin \
            --with-openssl=no \
            --without-sctp \
            CC=${{ matrix.host }}-gcc \
            CFLAGS="-O2 -Wall"

      - name: Build
        run: make -j$(nproc)

      - name: Strip & Verify
        run: |
          ${{ matrix.strip }} src/iperf3.exe
          file src/iperf3.exe
          mkdir -p dist
          cp src/iperf3.exe dist/iperf3-${{ matrix.arch }}-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iperf3-${{ matrix.arch }}-windows
          path: dist/iperf3-${{ matrix.arch }}-windows.exe
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 彙整所有 arch 的產物，一起發佈到 GitHub Release
  # ──────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs:
      - build-static
      - build-windows
    runs-on: ubuntu-latest
    # 只有推 tag 時才發布 Release；手動觸發只產生 artifact
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List files to be released
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
